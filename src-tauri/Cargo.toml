[package]
name = "px-agent-gui"
version = "0.1.0"
description = "PX Agent GUI client for Grok and Antigravity official CLIs"
authors = ["a0000"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "px_agent_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
